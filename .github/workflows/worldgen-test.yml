name: Worldgen probe
on:
  push:
    branches: [worldgen-test]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Server for 26.3
        run: |
          mkdir run && cd run
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys;d=json.load(sys.stdin);print([v['url'] for v in d['versions'] if v['id']=='26.3'][0])")
          jar=$(curl -s "$url" | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['server']['url'])")
          curl -s -o server.jar "$jar"
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-seed=12345\nspawn-protection=0\nmax-tick-time=-1\nsync-chunk-writes=false\n" > server.properties
          mkdir -p world/datapacks && cp ../test/sacrifice.zip world/datapacks/
      - name: Probe
        working-directory: run
        run: python3 ../test/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: run/server.log
